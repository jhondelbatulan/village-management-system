<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="50%" style="stop-color:#1a4b8c"/>
      <stop offset="100%" style="stop-color:#2d6cb5"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="300" cy="200" r="150" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1600" cy="800" r="200" fill="rgba(255,255,255,0.04)"/>
  <circle cx="960" cy="540" r="300" fill="rgba(255,255,255,0.02)"/>
  <text x="960" y="520" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-family="Segoe UI, sans-serif" font-size="48" font-weight="600">GIS-Enabled Village Management</text>
  <text x="960" y="580" text-anchor="middle" fill="rgba(255,255,255,0.1)" font-family="Segoe UI, sans-serif" font-size="24">Background Image Placeholder</text>
</svg>
