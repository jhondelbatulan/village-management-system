[package]
# Default command the Wasmer Edge web gateway runs for HTTP traffic.
# Without this the edge cannot determine the entrypoint and every
# request fails with x-edge-request-outcome=workload_failure.
entrypoint = "run"

[dependencies]
"php/php" = "=8.3.400"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

# Bind on 0.0.0.0 (not localhost) so the Wasmer Edge web gateway can reach
# the built-in PHP server inside the instance sandbox.
[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]

# Run Laravel CLI commands from Wasmer deployment jobs. Keeping this separate
# from `run` ensures Artisan arguments do not get appended to the web server.
[[command]]
name = "artisan"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/artisan"]
